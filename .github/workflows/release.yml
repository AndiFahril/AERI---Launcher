name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example 1.3.0"
        required: true
        default: "1.3.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_launcher.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build AERI.exe
        run: python -m PyInstaller --noconfirm --clean AERI.spec

      - name: Create release archive
        shell: pwsh
        run: ./tools/package_release.ps1 -Version "${{ inputs.version || github.ref_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERI-Windows
          path: release/AERI-Windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/AERI-Windows.zip
